<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="1200" height="540" fill="#FFFFFF"/>
<text x="40" y="52" font-size="28" fill="#0F172A" font-weight="700">AI Test Case Generator: how it works</text>
<text x="40" y="80" font-size="15" fill="#475569">From a user story or API spec to a structured, reviewable test suite with Claude</text>
<rect x="24" y="104" width="1152" height="260" rx="14" fill="#EFF6FF" stroke="#BFDBFE"/>
<text x="44" y="132" font-size="13" fill="#1D4ED8" font-weight="700" letter-spacing="1">GENERATE A TEST SUITE</text>
<rect x="44" y="144" width="250" height="180" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/>
<text x="62" y="174" font-size="15" fill="#0F172A" font-weight="700">User story / API spec</text>
<text x="62" y="200" font-size="12" fill="#334155">a markdown file or stdin</text>
<text x="62" y="220" font-size="12" fill="#334155">e.g. login with OTP,</text>
<text x="62" y="240" font-size="12" fill="#334155">a payment API</text>
<rect x="330" y="144" width="270" height="180" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
<text x="348" y="174" font-size="15" fill="#6D28D9" font-weight="700">Generate</text>
<text x="584" y="174" font-size="11" fill="#D97757" font-weight="700" text-anchor="end">CLAUDE</text>
<text x="348" y="200" font-size="12" fill="#334155">structured output</text>
<text x="348" y="220" font-size="12" fill="#334155">--effort low ... max</text>
<text x="348" y="240" font-size="12" fill="#334155">reads acceptance criteria</text>
<text x="348" y="260" font-size="12" fill="#334155">spots what&#x27;s missing</text>
<rect x="636" y="144" width="250" height="180" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
<text x="654" y="174" font-size="15" fill="#1D4ED8" font-weight="700">Validate</text>
<text x="654" y="200" font-size="12" fill="#334155">Pydantic TestSuite schema</text>
<text x="654" y="220" font-size="12" fill="#334155">ids, categories, priorities</text>
<text x="654" y="240" font-size="12" fill="#334155">steps, data, expected result</text>
<rect x="922" y="144" width="234" height="180" rx="10" fill="#FFFFFF" stroke="#16A34A" stroke-width="2"/>
<text x="940" y="174" font-size="15" fill="#15803D" font-weight="700">Export</text>
<text x="940" y="200" font-size="12" fill="#334155">Markdown for review</text>
<text x="940" y="220" font-size="12" fill="#334155">CSV for Zephyr / Xray /</text>
<text x="940" y="240" font-size="12" fill="#334155">Excel</text>
<text x="940" y="260" font-size="12" fill="#334155">JSON for automation</text>
<line x1="294" y1="234" x2="326" y2="234" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="600" y1="234" x2="632" y2="234" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="886" y1="234" x2="918" y2="234" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="24" y="384" width="1152" height="130" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="44" y="412" font-size="13" fill="#334155" font-weight="700" letter-spacing="1">EVERY TEST CASE HAS</text>
<rect x="44" y="430" width="36.4" height="30" rx="15.0" fill="#DBEAFE"/><text x="62.2" y="449.5" font-size="12" fill="#1D4ED8" font-weight="600" text-anchor="middle">ID</text>
<rect x="88.4" y="430" width="58.0" height="30" rx="15.0" fill="#DBEAFE"/><text x="117.4" y="449.5" font-size="12" fill="#1D4ED8" font-weight="600" text-anchor="middle">title</text>
<rect x="154.4" y="430" width="79.6" height="30" rx="15.0" fill="#DBEAFE"/><text x="194.2" y="449.5" font-size="12" fill="#1D4ED8" font-weight="600" text-anchor="middle">category</text>
<rect x="242.0" y="430" width="122.8" height="30" rx="15.0" fill="#DBEAFE"/><text x="303.4" y="449.5" font-size="12" fill="#1D4ED8" font-weight="600" text-anchor="middle">priority P0-P3</text>
<rect x="372.8" y="430" width="115.60000000000001" height="30" rx="15.0" fill="#DBEAFE"/><text x="430.6" y="449.5" font-size="12" fill="#1D4ED8" font-weight="600" text-anchor="middle">preconditions</text>
<rect x="496.40000000000003" y="430" width="58.0" height="30" rx="15.0" fill="#DBEAFE"/><text x="525.4000000000001" y="449.5" font-size="12" fill="#1D4ED8" font-weight="600" text-anchor="middle">steps</text>
<rect x="562.4000000000001" y="430" width="86.8" height="30" rx="15.0" fill="#DBEAFE"/><text x="605.8000000000001" y="449.5" font-size="12" fill="#1D4ED8" font-weight="600" text-anchor="middle">test data</text>
<rect x="657.2" y="430" width="130.0" height="30" rx="15.0" fill="#DBEAFE"/><text x="722.2" y="449.5" font-size="12" fill="#1D4ED8" font-weight="600" text-anchor="middle">expected result</text>
<rect x="795.2" y="430" width="166.0" height="30" rx="15.0" fill="#DBEAFE"/><text x="878.2" y="449.5" font-size="12" fill="#1D4ED8" font-weight="600" text-anchor="middle">acceptance criterion</text>
<text x="44" y="494" font-size="13" fill="#475569">Plus, for the whole suite: a summary, the assumptions made, and open questions for the product owner.</text>
</svg>
